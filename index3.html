<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>3 Div ile Daire Oluşturma</title>

<style>
  body {
    font-family: Arial, sans-serif;
  }

  h2 {
    margin-bottom: 40px;
  }

  .container {
    position: relative;
    width: 400px;
    height: 350px;
    margin: auto;
  }

  .circle {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    position: absolute;
    opacity: 0.7;
  }

  .red {
    background-color: red;
    top: 0;
    left: 0;
  }

  .blue {
    background-color: blue;
    top: 0;
    right: 0;
  }

  .yellow {
    background-color: yellow;
    bottom: 0;
    left: 100px;
  }
</style>
</head>

<body>

<h2>3 Div ile Daire Oluşturma</h2>

<div class="container">
  <div class="circle red"></div>
  <div class="circle blue"></div>
  <div class="circle yellow"></div>
</div>

</body>
</html>
